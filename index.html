  <style>
    .tanque {
      position: relative;
      width: 150px;
      height: 300px;
      border: 4px solid #555;
      border-radius: 20px;
      overflow: hidden;
      background: linear-gradient(to top, #d0d0d0, #ffffff);
      margin: 0 auto;
    }
    .agua {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(to top, #0077be, #00bfff);
      transition: height 0.5s ease-in-out;
    }
    .nivel-texto {
      position: absolute;
      width: 100%;
      text-align: center;
      top: 10px;
      font-family: sans-serif;
      font-size: 20px;
      color: #333;
    }
    button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      font-size: 16px;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="tanque">
    <div class="nivel-texto" id="nivelTexto">0%</div>
    <div class="agua" id="agua"></div>
    <button id="botonLlenar">Llenar</button>
  </div>

  <script>
    let nivel = 0;
    document.getElementById("botonLlenar").addEventListener("click", () => {
      if (nivel < 100) {
        nivel += 10;
        document.getElementById("agua").style.height = nivel + "%";
        document.getElementById("nivelTexto").textContent = nivel + "%";
      } else {
        alert("El tanque ya está lleno.");
      }
    });
  </script>
</body>
</html>
